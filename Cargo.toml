[package]
name = "nv-ssd-guard"
version = "0.3.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time"] }
winapi = { version = "0.3.9", features = ["handleapi", "processthreadsapi", "securitybaseapi", "tlhelp32", "winbase", "winnt"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
] }

[[bin]]
name = "nv-ssd-guard"
path = "src/main.rs"
